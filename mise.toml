[tools]
actionlint = "1.7.12"
betterleaks = "1.9.0"
go = "1.27.3"
golangci-lint = "2.15.0"
hk = { version = "2.7.1", workflow = "release.yml" }
"npm:@ls-lint/ls-lint" = "2.3.2"
pkl = "0.32.1"
shellcheck = "0.11.0"
tombi = "1.8.9"

[env]
BETTERLEAKS_CONFIG = "{{ config_root }}/.betterleaks.toml"

[tasks.check]
description = "Check repository formatting, lint, and workflow syntax"
run = ["hk check --all --check", "actionlint"]

[tasks.format]
description = "Apply repository formatting and lint fixes"
run = "hk fix --all"

[tasks.test]
description = "Run the Go tests with race detection"
run = "go test -race ./..."

[tasks.build]
description = "Build the library and headless example"
run = "go build ./..."
